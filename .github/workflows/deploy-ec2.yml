name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF

          set -e

          REPO="${{ github.repository }}"
          APP_DIR="\$HOME/bot"

          SERVICE_NAME="lvupbot"
          API_SERVICE_NAME="lvupbot-api"

          API_DIR="\$APP_DIR/python"
          API_VENV="\$API_DIR/.venv"

          PYTHON_VERSION="3.12.10"

          echo "========================================"
          echo "        LVUPBOT DEPLOY"
          echo "========================================"

          echo "===== System ====="
          echo "User: \$(whoami)"
          echo "Node: \$(node --version 2>/dev/null || echo 'NOT INSTALLED')"
          echo "NPM:  \$(npm --version 2>/dev/null || echo 'NOT INSTALLED')"
          echo "Python 3.12: \$(python3.12 --version 2>/dev/null || echo 'NOT INSTALLED')"

          free -h
          df -h

          ############################################
          # Install Git
          ############################################

          if ! command -v git >/dev/null 2>&1; then
            echo "Installing Git..."

            sudo apt-get update
            sudo apt-get install -y git
          fi

          ############################################
          # Check Node.js
          ############################################

          if ! command -v node >/dev/null 2>&1; then
            echo "ERROR: Node.js is not installed."
            exit 1
          fi

          if ! command -v npm >/dev/null 2>&1; then
            echo "ERROR: npm is not installed."
            exit 1
          fi

          echo "Node: \$(node --version)"
          echo "NPM:  \$(npm --version)"

          ############################################
          # Python 3.12
          ############################################

          if command -v python3.12 >/dev/null 2>&1; then

            echo "Python 3.12 already installed."

            API_PYTHON="\$(command -v python3.12)"

          else

            echo "Python 3.12 not found."
            echo "Installing with pyenv..."

            sudo apt-get update

            sudo apt-get install -y \
              build-essential \
              curl \
              git \
              libbz2-dev \
              libffi-dev \
              liblzma-dev \
              libncurses-dev \
              libreadline-dev \
              libsqlite3-dev \
              libssl-dev \
              tk-dev \
              xz-utils \
              zlib1g-dev

            export PYENV_ROOT="\$HOME/.pyenv"
            export PATH="\$PYENV_ROOT/bin:\$PYENV_ROOT/shims:\$PATH"

            if [ ! -x "\$PYENV_ROOT/bin/pyenv" ]; then
              echo "Installing pyenv..."

              curl https://pyenv.run | bash
            fi

            export PATH="\$PYENV_ROOT/bin:\$PYENV_ROOT/shims:\$PATH"

            eval "\$(pyenv init -)"

            if ! pyenv versions --bare | grep -qx "\$PYTHON_VERSION"; then

              echo "Building Python \$PYTHON_VERSION..."

              pyenv install "\$PYTHON_VERSION"

            fi

            API_PYTHON="\$PYENV_ROOT/versions/\$PYTHON_VERSION/bin/python"

          fi

          echo "Using Python:"
          "\$API_PYTHON" --version

          ############################################
          # Clone / Update repository
          ############################################

          if [ -d "\$APP_DIR/.git" ]; then

            echo "Updating repository..."

            cd "\$APP_DIR"

            git fetch origin master
            git reset --hard origin/master
            git clean -fd

          else

            echo "Cloning repository..."

            rm -rf "\$APP_DIR"

            git clone \
              "https://github.com/\$REPO.git" \
              "\$APP_DIR"

            cd "\$APP_DIR"

          fi

          ############################################
          # Verify project
          ############################################

          echo "===== Project ====="

          test -f "\$APP_DIR/index.js" || {
            echo "ERROR: index.js not found."
            exit 1
          }

          test -f "\$APP_DIR/package.json" || {
            echo "ERROR: package.json not found."
            exit 1
          }

          test -d "\$API_DIR" || {
            echo "ERROR: Python API directory not found:"
            echo "\$API_DIR"
            exit 1
          }

          test -f "\$API_DIR/main.py" || {
            echo "ERROR: main.py not found."
            exit 1
          }

          test -f "\$API_DIR/requirements.txt" || {
            echo "ERROR: requirements.txt not found."
            exit 1
          }

          ############################################
          # Create .env
          ############################################

          echo "Creating environment..."

          cat > "\$APP_DIR/.env" <<ENV
          TOKEN=${{ secrets.TOKEN }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=3306
          ENV

          chmod 600 "\$APP_DIR/.env"

          ############################################
          # Node dependencies
          ############################################

          echo "Installing Node dependencies..."

          cd "\$APP_DIR"

          if [ -f package-lock.json ]; then

            echo "Using npm ci..."

            npm ci --omit=dev

          else

            echo "WARNING: package-lock.json not found."
            echo "Using npm install..."

            npm install --omit=dev

          fi

          ############################################
          # Python virtual environment
          ############################################

          echo "Setting up Python virtual environment..."

          if [ ! -x "\$API_VENV/bin/python" ]; then

            echo "Creating virtual environment..."

            "\$API_PYTHON" -m venv "\$API_VENV"

          fi

          echo "Installing Python dependencies..."

          "\$API_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --upgrade pip

          "\$API_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            -r "\$API_DIR/requirements.txt"

          ############################################
          # Create Node.js systemd service
          ############################################

          echo "Creating Node.js service..."

          sudo tee "/etc/systemd/system/\$SERVICE_NAME.service" > /dev/null <<SERVICE

          [Unit]
          Description=LVUP Discord Bot
          After=network-online.target mysql.service
          Wants=network-online.target

          [Service]
          Type=simple

          User=${{ secrets.EC2_USER }}

          WorkingDirectory=\$APP_DIR

          Environment=NODE_ENV=production

          Environment=NODE_OPTIONS=--max-old-space-size=384

          ExecStart=/usr/bin/node \$APP_DIR/index.js

          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

          SERVICE

          ############################################
          # Create Python API systemd service
          ############################################

          echo "Creating Python API service..."

          sudo tee "/etc/systemd/system/\$API_SERVICE_NAME.service" > /dev/null <<SERVICE

          [Unit]
          Description=LVUP Python API Server
          After=network-online.target mysql.service
          Wants=network-online.target

          [Service]
          Type=simple

          User=${{ secrets.EC2_USER }}

          WorkingDirectory=\$API_DIR

          Environment=PYTHONUNBUFFERED=1

          ExecStart=\$API_VENV/bin/python \$API_DIR/main.py

          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

          SERVICE

          ############################################
          # Reload systemd
          ############################################

          sudo systemctl daemon-reload

          sudo systemctl enable "\$SERVICE_NAME"
          sudo systemctl enable "\$API_SERVICE_NAME"

          ############################################
          # Restart applications
          ############################################

          echo "Restarting applications..."

          sudo systemctl restart "\$SERVICE_NAME"
          sudo systemctl restart "\$API_SERVICE_NAME"

          ############################################
          # Wait
          ############################################

          sleep 5

          ############################################
          # Check Node service
          ############################################

          if ! sudo systemctl is-active --quiet "\$SERVICE_NAME"; then

            echo "========================================"
            echo "      DISCORD BOT FAILED"
            echo "========================================"

            sudo systemctl status \
              "\$SERVICE_NAME" \
              --no-pager \
              || true

            echo "===== Discord Bot Logs ====="

            sudo journalctl \
              -u "\$SERVICE_NAME" \
              -n 100 \
              --no-pager \
              || true

            exit 1

          fi

          ############################################
          # Check API service
          ############################################

          if ! sudo systemctl is-active --quiet "\$API_SERVICE_NAME"; then

            echo "========================================"
            echo "       PYTHON API FAILED"
            echo "========================================"

            sudo systemctl status \
              "\$API_SERVICE_NAME" \
              --no-pager \
              || true

            echo "===== Python API Logs ====="

            sudo journalctl \
              -u "\$API_SERVICE_NAME" \
              -n 100 \
              --no-pager \
              || true

            exit 1

          fi

          ############################################
          # Successful deployment
          ############################################

          echo "========================================"
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          echo "===== Services ====="

          sudo systemctl --no-pager --type=service \
            --state=running \
            | grep -E "\$SERVICE_NAME|\$API_SERVICE_NAME" \
            || true

          echo "===== Memory ====="

          free -h

          echo "===== Disk ====="

          df -h

          echo "===== Done ====="

          EOF
