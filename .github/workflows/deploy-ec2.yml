name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF

          set -e

          REPO="${{ github.repository }}"
          APP_DIR="\$HOME/bot"
          SERVICE_NAME="lvupbot"
          API_SERVICE_NAME="lvupbot-api"
          API_DIR="\$APP_DIR/python"
          API_VENV="\$API_DIR/.venv"
          PYTHON_VERSION="3.12.10"

          echo "========================================"
          echo "        LVUPBOT DEPLOY"
          echo "========================================"

          echo "===== System ====="
          free -h
          df -h

          ############################################
          # Install Git
          ############################################

          if ! command -v git >/dev/null 2>&1; then
            echo "Installing Git..."

            sudo apt-get update
            sudo apt-get install -y git
          fi

          # if ! command -v node >/dev/null 2>&1; then
          #   echo "Installing Node.js 22..."

          #   curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          #   sudo apt-get install -y nodejs
          # fi

          echo "Node: \$(node --version)"
          echo "NPM:  \$(npm --version)"

          if command -v python3.12 >/dev/null 2>&1; then
            API_PYTHON="\$(command -v python3.12)"
          else
            echo "Building Python \$PYTHON_VERSION with pyenv..."
            sudo apt-get update
            sudo apt-get install -y \
              build-essential curl libbz2-dev libffi-dev liblzma-dev \
              libncurses-dev libreadline-dev libsqlite3-dev libssl-dev \
              tk-dev xz-utils zlib1g-dev

            export PYENV_ROOT="\$HOME/.pyenv"
            export PATH="\$PYENV_ROOT/bin:\$PATH"

            if [ ! -x "\$PYENV_ROOT/bin/pyenv" ]; then
              curl https://pyenv.run | bash
            fi

            export PATH="\$PYENV_ROOT/bin:\$PYENV_ROOT/shims:\$PATH"
            eval "\$(pyenv init -)"
            pyenv install -s "\$PYTHON_VERSION"
            API_PYTHON="\$PYENV_ROOT/versions/\$PYTHON_VERSION/bin/python"
          fi

          ############################################
          # Clone / Update repository
          ############################################

          if [ -d "\$APP_DIR/.git" ]; then

            echo "Updating repository..."

            cd "\$APP_DIR"

            git fetch origin
            git reset --hard origin/master
            git clean -fd

          else

            echo "Cloning repository..."

            rm -rf "\$APP_DIR"

            git clone \
              "https://github.com/\$REPO.git" \
              "\$APP_DIR"

            cd "\$APP_DIR"

          fi

          ############################################
          # Create .env
          ############################################

          echo "Creating environment..."

          cat > .env <<ENV
          TOKEN=${{ secrets.TOKEN }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=3306
          ENV

          ############################################
          # Install dependencies
          ############################################

          echo "Installing dependencies..."

          npm i

          echo "Installing API dependencies..."

          "\$API_PYTHON" -m venv "\$API_VENV"
          "\$API_VENV/bin/pip" install --upgrade pip
          "\$API_VENV/bin/pip" install -r "\$API_DIR/requirements.txt"

          ############################################
          # Create systemd service
          ############################################

          echo "Creating systemd service..."

          sudo tee /etc/systemd/system/\$SERVICE_NAME.service > /dev/null <<SERVICE
          [Unit]
          Description=LVUP Discord Bot
          After=network.target

          [Service]
          Type=simple

          User=${{ secrets.EC2_USER }}
          WorkingDirectory=\$APP_DIR

          Environment=NODE_ENV=production

          ExecStart=/usr/bin/node \$APP_DIR/index.js

          Restart=always
          RestartSec=5

          # Prevent Node.js from consuming all RAM
          Environment=NODE_OPTIONS=--max-old-space-size=384

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo tee /etc/systemd/system/\$API_SERVICE_NAME.service > /dev/null <<SERVICE
          [Unit]
          Description=LVUP Facebed API Server
          After=network.target

          [Service]
          Type=simple

          User=${{ secrets.EC2_USER }}
          WorkingDirectory=\$API_DIR

          Environment=PYTHONUNBUFFERED=1

          ExecStart=\$API_VENV/bin/python \$API_DIR/main.py

          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          ############################################
          # Restart service
          ############################################

          sudo systemctl daemon-reload
          sudo systemctl enable \$SERVICE_NAME
          sudo systemctl enable \$API_SERVICE_NAME
          sudo systemctl restart \$SERVICE_NAME
          sudo systemctl restart \$API_SERVICE_NAME

          ############################################
          # Wait for application
          ############################################

          sleep 3

          ############################################
          # Check application
          ############################################

           if sudo systemctl is-active --quiet \$SERVICE_NAME && \
             sudo systemctl is-active --quiet \$API_SERVICE_NAME; then

            echo "========================================"
            echo "       DEPLOYMENT SUCCESSFUL"
            echo "========================================"

          else

            echo "========================================"
            echo "       DEPLOYMENT FAILED"
            echo "========================================"

            sudo systemctl status \
              \$SERVICE_NAME \
              \$API_SERVICE_NAME \
              --no-pager

            echo "===== Logs ====="

            sudo journalctl \
              -u \$SERVICE_NAME \
              -u \$API_SERVICE_NAME \
              -n 100 \
              --no-pager

            exit 1

          fi

          ############################################
          # Status
          ############################################

          echo "===== Service ====="

          sudo systemctl status \
            \$SERVICE_NAME \
            \$API_SERVICE_NAME \
            --no-pager

          echo "===== Memory ====="

          free -h

          echo "===== Disk ====="

          df -h

          echo "===== Done ====="

          EOF
